<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#27272a" stroke-width="1" stroke-opacity="0.5" />
    </pattern>

    <!-- Cyan Accent Glow Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Base Card Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Engineering Grid Overlay -->
  <rect width="512" height="512" rx="112" fill="url(#grid)" />

  <!-- Outer Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#3f3f46" stroke-width="6" stroke-dasharray="12 12" stroke-opacity="0.6" />

  <!-- Code Brackets Icon Base -->
  <g transform="translate(106, 120)" stroke="url(#accentGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left Bracket < -->
    <path d="M 70 40 L 10 90 L 70 140" />
    <!-- Right Bracket > -->
    <path d="M 230 40 L 290 90 L 230 140" />
    <!-- Forward Slash / -->
    <path d="M 170 30 L 130 150" />
  </g>

  <!-- Initials "BK" Text -->
  <text x="256" y="380" text-anchor="middle" font-family="monospace, system-ui, sans-serif" font-weight="900" font-size="110" fill="#f4f4f5" letter-spacing="4">BK</text>

  <!-- Live Status Pulse Dot -->
  <circle cx="410" cy="102" r="14" fill="#10b981" />
</svg>