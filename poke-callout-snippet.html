<!-- 1) In <head>: handwriting font (add next to your other <link> tags) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">


<!-- 2) Inside <main>, as the VERY LAST child (after the Contact section).
        Keep it last so entrance.js, which reads main.children by position, isn't affected. -->
<div class="poke-callout" aria-hidden="true">
    <div class="poke-callout-title">
        <span class="poke-callout-hand">👈</span>
        <span>Give it a Poke!</span>
    </div>
    <p class="poke-callout-sub">Every poke counts!<br>Everyone's pokes add up.</p>
</div>
